; OLED: SSD1306 by default. For an SH1106 panel add  -D OLED_SH1106=1  to build_flags.
; Buzzer: active (DC) by default. For a passive buzzer add  -D BUZZER_PASSIVE=1.
[env]
lib_deps = olikraus/U8g2@^2.35.30

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<hw_test/>

[env:esp32dev_wifi]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -D WIFI_STREAMING=1
build_src_filter = +<*> -<hw_test/>

; Breadboard hardware check (src/hw_test/), separate from the streaming firmware.
[env:hw_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<hw_test/> +<display.cpp>
